; GTPB 软件出厂依赖配置（software-dependency）—— 随软件根目录发布，运行时只读。
;
; 与用户配置 config.json 的区别：
;   configsetting.ini  = 软件默认行为、出厂常量、枚举表（不提供用户加载/保存）
;   config.json        = 用户个性化配置（GUI 可加载/另存为），首次运行由本文件派生
;   profiles/*.json    = 用户个性化映射 Profile（GUI 通道映射编辑后保存）
;   .gtpb_settings     = 用户上次加载的 config.json 路径（自动维护）
;
; 重要：修改本文件仅影响新生成的 config.json，不会回写已存在的用户配置。

[proxy]
; 游戏端 WebSocket 监听地址 / 端口
listenAddress = 127.0.0.1
wsPort = 12345
; 游戏端 TCP 监听端口（0 = 禁用）
tcpPort = 0
; Intiface Central 默认地址（项目硬约束：12346 而非官方默认 12348）
backendUrl = ws://127.0.0.1:12346

[logging]
; 单文件日志路径（相对 EXE 目录 / BASE_DIR）
dir = gtpb.log
captureRaw = true
level = INFO

[safety]
; 指令合并最小间隔（毫秒）；越小延迟越低，但会增大底层压力
commandMinIntervalMs = 5

[paths]
; 用户首次运行 / 「生成默认配置」时使用的 Profile 模板（不写绝对路径，留空 = 不预设）
defaultProfile = profiles/default.json

[profile]
; 设备呈现模式：passthrough = 透传真实设备描述（默认，兼容已知游戏）
;                 osr6 = 向游戏虚拟一台 OSR6 六轴设备
virtualMode = passthrough

[enum]
; 通道目标执行器允许取值
validTargets = Vibrate,Rotate,Linear
; 设备呈现模式允许取值
virtualModes = passthrough,osr6
; 通道名 -> 默认 (目标, 电机)
defaultChannels = L0:Vibrate:0,L1:Vibrate:1,L2:Vibrate:2,R0:Rotate:0,R1:Rotate:1,R2:Linear:0
; 设备指令键 -> 默认通道
defaultBindings = Vibrate:0:0:L0,Vibrate:0:1:L1,Vibrate:0:2:L2,Rotate:0:0:R0,Rotate:0:1:R1,Linear:0:0:R2
