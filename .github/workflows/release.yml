name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: '3.11'
            asset_name: 'GTPB-win64'
            compress_ext: 'zip'
            exe_name: 'GTPB.exe'
          - os: ubuntu-latest
            py: '3.11'
            asset_name: 'GTPB-linux-x64'
            compress_ext: 'tar.gz'
            exe_name: 'GTPB'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean gtpb.spec

      - name: Inspect dist
        shell: bash
        run: |
          ls -la dist/
          ls -la dist/*

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GTPB.exe" -DestinationPath "${{ matrix.asset_name }}.${{ matrix.compress_ext }}"
          Get-Item "${{ matrix.asset_name }}.${{ matrix.compress_ext }}" | Select-Object Name, Length

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp dist/GTPB package/GTPB
          tar -czf "${{ matrix.asset_name }}.${{ matrix.compress_ext }}" -C package GTPB
          ls -la "${{ matrix.asset_name }}.${{ matrix.compress_ext }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.${{ matrix.compress_ext }}
          generate_release_notes: false